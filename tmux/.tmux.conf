# --- General ---

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Terminal & True-Color (tmux 3.2+) ---

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# --- Behavior ---

set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 100000
set -g history-file ~/.tmux_history
set -g display-time 3000

# --- Clipboard & Copy Mode ---

set -g set-clipboard on
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Pane & Window Bindings ---

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n C-S-h previous-window
bind -n C-S-l next-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# --- Vim-Tmux Navigator ---
# https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# --- Nested Session Toggle (F12) ---

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-left "#[fg=colour231,bg=colour04] OFF #[default] " \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-left \;\
    refresh-client -S

# --- Notifications ---

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Theme (gruvbox-warm) ---

set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style 'bg=colour235 fg=colour223'
set -g status-left-length 20
set -g status-right-length 50
set -g status-left ''
set -g status-right '#{?client_prefix,#[fg=colour232 bg=colour214 bold] PREFIX #[default] ,}#[fg=colour223,bg=colour239] %H:%M #[fg=colour223,bg=colour237] %d-%b '

setw -g window-status-format ' #[fg=colour246]#I#[fg=colour244]:#[fg=colour246]#W#[fg=colour244]#F '
setw -g window-status-current-format ' #[fg=colour214,bold]#I#[fg=colour250]:#[fg=colour255,bold]#W#[fg=colour214]#F '
setw -g window-status-current-style 'bg=colour239'
setw -g window-status-style ''
setw -g window-status-bell-style 'fg=colour255 bg=colour167 bold'

set -g pane-border-style 'fg=colour239'
set -g pane-active-border-style 'fg=colour214'

set -g message-style 'fg=colour235 bg=colour214 bold'
set -g message-command-style 'fg=colour214 bg=colour235'
setw -g mode-style 'fg=colour235 bg=colour214 bold'
setw -g clock-mode-colour colour214

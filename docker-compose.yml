services:
  shell:
    build: .
    volumes:
      - .:/root/.dotfiles
    stdin_open: true
    tty: true

  bench:
    build: .
    volumes:
      - .:/root/.dotfiles
    command: ["bench-startup", "--threshold", "200"]

  nvim:
    build: .
    volumes:
      - .:/root/.dotfiles
      - nvim-data:/root/.local/share/nvim
    stdin_open: true
    tty: true
    command: ["nvim"]

volumes:
  nvim-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build shell

      - name: Run test suite
        run: docker compose run --rm shell test-shell

      - name: Benchmark startup time
        run: docker compose run --rm bench
